name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        working-directory: ${{ github.workspace }}
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Tidy modules
        working-directory: ${{ github.workspace }}
        run: go mod tidy

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: go test ./...

      - name: Build server
        working-directory: ${{ github.workspace }}
        run: go build ./cmd/server

      - name: Validate Docker Compose
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env.example config

  compose-smoke:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Docker Compose smoke test
        working-directory: ${{ github.workspace }}
        run: bash scripts/compose-smoke-test.sh
